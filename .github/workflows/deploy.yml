name: Test Gridz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Typecheck And Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report dependency updates and vulnerabilities
        continue-on-error: true
        timeout-minutes: 3
        run: |
          npm outdated --workspaces --include-workspace-root > dependency-updates.txt 2>&1 || true
          npm audit > dependency-audit.txt 2>&1 || true
          {
            printf '## Available dependency updates\n\n```text\n'
            cat dependency-updates.txt
            printf '\n```\n\n## Dependency security audit\n\n```text\n'
            cat dependency-audit.txt
            printf '\n```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: apps/web/dist
          retention-days: 1

  model-tests:
    name: Model Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -w @grids/web -- playwright test --project=model
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: model-test-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  browser-tests:
    name: Browser Tests (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: apps/web/dist
      - run: npm exec -w @grids/web -- playwright test --project=browser --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-report-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  api-tests:
    name: API And Postgres Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grids
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: grids_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grids -d grids_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://grids:ci-only@localhost:5432/grids_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @grids/api
      - run: npm run test:api
      - run: npm run test:database
